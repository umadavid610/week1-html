<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>David Forms</title>
  </head>
  <body>
    <header>
      <h1>Learn to code Application</h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Personal details</legend>
          <ul>
            <li>
              <label for="name">Full name</label>
              <input type="text" id="name" name="name" required />
            </li>
            <li>
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required />
            </li>
            <li>
              <label for="pwd">Password</label>
              <input
                type="password"
                id="pwd"
                name="password"
                minlength="8"
                required
              />
            </li>
            <li>
              <label for="dob">Date of Birth</label>
              <input type="date" id="dob" name="dob" />
            </li>
            <li>
              <label for="level">Course Level</label>
              <select id="level" name="level">
                <option value="first-year">100L</option>
                <option value="second-year">200L</option>
                <option value="third-year">300L</option>
              </select>
            </li>
          </ul>
        </fieldset>
        <fieldset>
          <legend>Study Time</legend>

          <input type="radio" id="morn" name="time" value="morning" />
          <label for="morn">morning</label>
          <input type="radio" id="aft" name="time" value="afternoon" />
          <label for="aft">afternoon</label>
          <input type="radio" id="eve" name="time" value="evening" />
          <label for="eve">evening</label>
        </fieldset>
        <fieldset>
          <legend>Comment</legend>
          <label for="comment">Why do you want to learn how to code</label>
          <br />
          <textarea
            id="comment"
            name="comment"
            maxlength="200"
            rows="11"
            cols="99"
            placeholder="I want to learn how to code because....."
          ></textarea>
        </fieldset>
        <p>
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">I agree to the terms</label>
        </p>
        <p>
          <button>Submit</button>
        </p>
      </form>
    </main>
    <footer>
      <p>
        &copy; 2026 David Uma Elijah
        <a href="https://github.com/umadavid610">GitHub</a>
      </p>
    </footer>
  </body>
  </html>
